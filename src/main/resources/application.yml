spring:
  profiles:
    active: ${SPRING_PROFILTES_ACTIVE:local}

  flyway:
    enabled: true
    baseline-on-migrate: true

  firebase:
    service-account:
      path: "firebase/service-account.json"

  mqtt:
    broker-url: ${MQTT_BROKER_URL}
    client-id: ${MQTT_CLIENT_ID}
    username: ${MQTT_USERNAME}
    password: ${MQTT_PASSWORD}