spring:
  datasource:
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/${RDS_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    locations:
      - classpath:db/migration

  data:
    redis:
      host: ${ELASTICACHE_ENDPOINT}
      port: 6379
      ssl:
        enabled: true

  mongodb:
    uri: mongodb+srv://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_ATLAS_HOST}/${MONGO_DATABASE}?retryWrites=true&w=majority

logging:
  level:
    root: WARN
    com.myapp: INFO